<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickInvoice - Free Professional Invoice Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen pb-12">

    <header class="bg-white border-b border-slate-200 py-4 px-6 mb-8 no-print">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">Q</div>
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">QuickInvoice</span>
            </div>
            <button onclick="downloadPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg shadow-sm transition flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>Download PDF</span>
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4">
        <div class="flex flex-wrap justify-between items-center mb-6 gap-4 no-print">
            <h1 class="text-2xl font-bold text-slate-900">Invoice Editor</h1>
            <div class="flex gap-3">
                <button onclick="window.print()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium px-4 py-2 rounded-lg transition">Print</button>
                <button onclick="downloadPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg transition">Export PDF</button>
            </div>
        </div>

        <div id="invoice" class="bg-white p-8 md:p-12 rounded-xl shadow-lg border border-slate-200">
            <div class="flex flex-col md:flex-row justify-between border-b border-slate-200 pb-8 mb-8 gap-6">
                <div>
                    <h2 class="text-3xl font-extrabold text-indigo-600 tracking-tight uppercase mb-2">INVOICE</h2>
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-semibold text-slate-400">#</span>
                        <input type="text" value="INV-2026-001" class="font-semibold text-slate-700 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1 outline-none">
                    </div>
                </div>
                
                <div class="text-left md:text-right">
                    <input type="text" placeholder="Your Company Name" value="Acme Studio Inc." class="font-bold text-lg text-slate-800 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1 outline-none w-full md:text-right">
                    <input type="text" placeholder="Your Email / Phone" value="billing@acmestudio.com" class="text-sm text-slate-500 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1 outline-none w-full md:text-right mt-1">
                    <input type="text" placeholder="Address" value="123 Creative Street, Tech City" class="text-sm text-slate-500 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1 outline-none w-full md:text-right mt-1">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Billed To</h3>
                    <input type="text" placeholder="Client Name" value="Client LLC" class="font-bold text-slate-800 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1 outline-none w-full mb-1">
                    <input type="text" placeholder="Client Address" value="456 Market Ave, San Francisco, CA" class="text-sm text-slate-500 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1 outline-none w-full">
                </div>
                <div class="flex flex-col md:items-end justify-center">
                    <div class="flex items-center gap-4 mb-2">
                        <span class="text-sm font-medium text-slate-500">Date:</span>
                        <input type="date" value="2026-09-15" class="text-sm text-slate-700 border border-slate-200 rounded px-2 py-1 outline-none focus:border-indigo-500">
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-sm font-medium text-slate-500">Due Date:</span>
                        <input type="date" value="2026-09-30" class="text-sm text-slate-700 border border-slate-200 rounded px-2 py-1 outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto mb-8">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                            <th class="py-3 px-2 w-1/2">Item Description</th>
                            <th class="py-3 px-2 text-center w-20">Qty</th>
                            <th class="py-3 px-2 text-right w-28">Price ($)</th>
                            <th class="py-3 px-2 text-right w-28">Amount ($)</th>
                            <th class="py-3 px-2 w-10 no-print"></th>
                        </tr>
                    </thead>
                    <tbody id="items-table">
                        <tr class="border-b border-slate-100 item-row">
                            <td class="py-3 px-2">
                                <input type="text" value="Web Design & Development" class="w-full border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1 outline-none font-medium text-slate-700">
                            </td>
                            <td class="py-3 px-2 text-center">
                                <input type="number" value="1" min="1" onchange="calculate()" oninput="calculate()" class="qty w-16 text-center border border-slate-200 rounded px-1 py-1 outline-none focus:border-indigo-500">
                            </td>
                            <td class="py-3 px-2 text-right">
                                <input type="number" value="1200" min="0" step="0.01" onchange="calculate()" oninput="calculate()" class="price w-24 text-right border border-slate-200 rounded px-1 py-1 outline-none focus:border-indigo-500">
                            </td>
                            <td class="py-3 px-2 text-right font-semibold text-slate-800 amount">1200.00</td>
                            <td class="py-3 px-2 text-center no-print">
                                <button onclick="removeItem(this)" class="text-red-400 hover:text-red-600 font-bold px-2">✕</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mb-8 no-print">
                <button onclick="addItem()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold px-4 py-2 rounded-lg transition text-sm flex items-center gap-1">
                    <span>+ Add Line Item</span>
                </button>
            </div>

            <div class="flex justify-end border-t border-slate-200 pt-6">
                <div class="w-full md:w-64 space-y-3">
                    <div class="flex justify-between text-sm text-slate-600">
                        <span>Subtotal:</span>
                        <span id="subtotal" class="font-semibold text-slate-800">$1,200.00</span>
                    </div>
                    <div class="flex justify-between text-sm text-slate-600 items-center">
                        <span>Tax Rate (%):</span>
                        <input type="number" id="tax-rate" value="10" min="0" max="100" onchange="calculate()" oninput="calculate()" class="w-16 text-right border border-slate-200 rounded px-1 py-1 text-sm outline-none focus:border-indigo-500">
                    </div>
                    <div class="flex justify-between text-sm text-slate-600">
                        <span>Tax Amount:</span>
                        <span id="tax-amount">$120.00</span>
                    </div>
                    <div class="flex justify-between text-base font-bold text-slate-900 border-t border-slate-200 pt-3">
                        <span>Total Due:</span>
                        <span id="total-amount" class="text-indigo-600">$1,320.00</span>
                    </div>
                </div>
            </div>

            <div class="mt-12 pt-6 border-t border-slate-100">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Notes & Terms</h4>
                <textarea class="w-full text-sm text-slate-500 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded p-2 outline-none resize-none" rows="2">Thank you for your business! Please send payment within 15 days of invoice date.</textarea>
            </div>
        </div>
    </main>

    <script>
        function calculate() {
            let rows = document.querySelectorAll('.item-row');
            let subtotal = 0;

            rows.forEach(row => {
                let qty = parseFloat(row.querySelector('.qty').value) || 0;
                let price = parseFloat(row.querySelector('.price').value) || 0;
                let amount = qty * price;
                row.querySelector('.amount').textContent = amount.toFixed(2);
                subtotal += amount;
            });

            let taxRate = parseFloat(document.getElementById('tax-rate').value) || 0;
            let taxAmount = subtotal * (taxRate / 100);
            let total = subtotal + taxAmount;

            document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
            document.getElementById('tax-amount').textContent = '$' + taxAmount.toFixed(2);
            document.getElementById('total-amount').textContent = '$' + total.toFixed(2);
        }

        function addItem() {
            let tbody = document.getElementById('items-table');
            let tr = document.createElement('tr');
            tr.className = 'border-b border-slate-100 item-row';
            tr.innerHTML = `
                <td class="py-3 px-2">
                    <input type="text" placeholder="Item description" class="w-full border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded px-1 outline-none font-medium text-slate-700">
                </td>
                <td class="py-3 px-2 text-center">
                    <input type="number" value="1" min="1" onchange="calculate()" oninput="calculate()" class="qty w-16 text-center border border-slate-200 rounded px-1 py-1 outline-none focus:border-indigo-500">
                </td>
                <td class="py-3 px-2 text-right">
                    <input type="number" value="0.00" min="0" step="0.01" onchange="calculate()" oninput="calculate()" class="price w-24 text-right border border-slate-200 rounded px-1 py-1 outline-none focus:border-indigo-500">
                </td>
                <td class="py-3 px-2 text-right font-semibold text-slate-800 amount">0.00</td>
                <td class="py-3 px-2 text-center no-print">
                    <button onclick="removeItem(this)" class="text-red-400 hover:text-red-600 font-bold px-2">✕</button>
                </td>
            `;
            tbody.appendChild(tr);
            calculate();
        }

        function removeItem(btn) {
            let rows = document.querySelectorAll('.item-row');
            if (rows.length > 1) {
                btn.closest('tr').remove();
                calculate();
            }
        }

        function downloadPDF() {
            const element = document.getElementById('invoice');
            const opt = {
                margin:       0.3,
                filename:     'Invoice_QuickInvoice.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        calculate();
    </script>
</body>
              </html>
